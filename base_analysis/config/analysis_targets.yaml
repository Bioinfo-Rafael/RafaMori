distances:
  reaction_bond:
    label: Reaction N--C distance
    atoms: [reaction_N, reaction_C]
    com_baseline: com_amine_coumarin_core
  hb_substituent:
    label: Substituent--amine H-bond distance
    atoms: [hb_substituent_F, hb_substituent_H]
    com_baseline: com_amine_substituent
  hb_coumarin:
    label: Coumarin--amine H-bond distance
    atoms: [hb_coumarin_O, hb_coumarin_H]
    com_baseline: com_amine_coumarin_core
  interference:
    label: Coumarin--substituent interference distance
    atoms: [interference_F, interference_O]
    com_baseline: com_substituent_coumarin_core

angles:
  hb_substituent_angle:
    label: Substituent--amine H-bond angle
    atoms: [hb_substituent_F, hb_substituent_H, reaction_N]
  hb_coumarin_angle:
    label: Coumarin--amine H-bond angle
    atoms: [hb_coumarin_O, hb_coumarin_H, reaction_N]

com_baselines:
  com_amine_coumarin_core:
    label: amine_side vs coumarin_core COM distance
    fragments: [amine_side, coumarin_core]
  com_amine_substituent:
    label: amine_side vs substituent_side COM distance
    fragments: [amine_side, substituent_side]
  com_substituent_coumarin_core:
    label: substituent_side vs coumarin_core COM distance
    fragments: [substituent_side, coumarin_core]

fragments:
